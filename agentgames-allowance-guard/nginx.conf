worker_processes 1;
pid /tmp/allowance-guard-nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
    access_log off;
    server_tokens off;
    client_body_temp_path /tmp/allowance-guard-body;
    proxy_temp_path /tmp/allowance-guard-proxy;
    client_max_body_size 16k;
    client_body_timeout 5s;
    client_header_timeout 5s;
    keepalive_timeout 10s;
    send_timeout 10s;
    limit_req_zone $binary_remote_addr zone=assess:1m rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=connections:1m;
    server {
        listen __PORT__;
        limit_conn connections 32;
        location / {
            limit_except GET POST { deny all; }
            limit_req zone=assess burst=20 nodelay;
            limit_req_status 429;
            proxy_pass http://127.0.0.1:8765;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection close;
            proxy_set_header X-Forwarded-Host "";
            proxy_set_header X-Forwarded-Proto "";
            proxy_set_header Forwarded "";
            proxy_request_buffering on;
            proxy_buffering off;
            proxy_connect_timeout 2s;
            proxy_read_timeout 10s;
            proxy_send_timeout 10s;
        }
    }
}
